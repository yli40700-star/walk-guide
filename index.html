<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>随身导游</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#41B6E6; --star:#E4002B; --ink:#14212B; --paper:#FFFFFF; --mist:#EAF6FC; --line:#C9E6F4; --muted:#5B6B77;
  --latin:"Archivo Narrow","Arial Narrow",system-ui,sans-serif;
  --cjk:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --ink:#E8F1F6; --paper:#0E1A22; --mist:#132733; --line:#1F3B4C; --muted:#93A8B5; --sky:#5EC4EE; }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--cjk);font-size:17px;line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:0 20px 56px}
.flag{position:relative;padding:28px 0 22px}
.flag::before,.flag::after{content:"";position:absolute;left:-20px;right:-20px;height:10px;background:var(--sky)}
.flag::before{top:12px}.flag::after{bottom:0}
.title{display:flex;align-items:center;gap:12px;margin:14px 0 0}
.title h1{font-family:var(--latin);font-weight:700;font-size:34px;margin:0;line-height:1.1}
.title h1 span{font-family:var(--cjk)}
svg.star{width:30px;height:30px;flex:none;fill:var(--star)}
.sub{color:var(--muted);font-size:15px;margin:4px 0 0}

.loc{margin:22px 0 0;padding:14px 16px;border-left:6px solid var(--star);background:var(--mist);border-radius:0 10px 10px 0}
.loc .coords{font-family:var(--latin);font-size:15px;color:var(--muted)}
.loc .state{font-weight:600}

.main-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin:18px 0 0;padding:18px;border:0;border-radius:14px;background:var(--star);color:#fff;font:700 20px var(--cjk);cursor:pointer}
.main-btn:disabled{opacity:.55}
.main-btn svg{width:22px;height:22px;fill:#fff}
.row{display:flex;gap:10px;margin-top:12px}
.ghost{flex:1;padding:12px;border:2px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font:600 15px var(--cjk);cursor:pointer}
.ghost[aria-pressed="true"]{border-color:var(--sky);background:var(--mist)}
.ghost:disabled{opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

.status{display:none;margin-top:14px;padding:12px 16px;border-radius:12px;background:var(--mist);border:2px dashed var(--sky);font-size:15px}
.status.show{display:block}

details{margin-top:18px;border-top:2px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:600;color:var(--muted)}
label.lbl{display:block;margin-top:12px;font-size:14px;color:var(--muted)}
.field{width:100%;margin-top:6px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:16px var(--cjk)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0}
.chip span{display:inline-block;padding:6px 14px;border-radius:999px;border:2px solid var(--line);font-size:15px;cursor:pointer}
.chip input:checked+span{background:var(--sky);border-color:var(--sky);color:#fff}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}

.ask{display:flex;gap:8px;margin-top:22px}
.ask .field{margin:0}
.ask button{flex:none;width:auto;padding:0 18px}

.story{margin-top:26px}
.story .where{font-size:19px;font-weight:700;margin:0 0 6px}
.story h2{display:flex;gap:10px;align-items:baseline;font-size:19px;margin:24px 0 6px;line-height:1.4}
.story h2::before{content:"";flex:none;width:12px;height:12px;background:var(--star);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.story ul{margin:0 0 8px;padding-left:1.2em}
.story li{margin:0 0 8px}
.story p{margin:0 0 10px}
.story .next{margin-top:20px;padding:14px 16px;border-radius:12px;background:var(--mist)}
.story .q{color:var(--muted);font-size:15px;margin:0 0 10px}
.thinking{color:var(--muted)}
.err{color:var(--star);font-weight:600}
.foot{margin-top:30px;font-size:13px;color:var(--muted)}
.hide{display:none!important}
@media (prefers-reduced-motion:no-preference){
  .pulse svg.star{animation:p 1.4s ease-in-out infinite}
  @keyframes p{50%{transform:scale(1.18)}}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="flag">
    <div class="title" id="titleRow">
      <svg class="star" viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,2 61,32 94,24 72,50 94,76 61,68 50,98 39,68 6,76 28,50 6,24 39,32"/></svg>
      <h1>Walk <span>随身导游</span></h1>
    </div>
    <p class="sub">边走边听身边建筑和街区的故事。</p>
  </header>

  <section id="setup" class="hide">
    <div class="status show">第一次使用：填入两个 API key。它们只保存在这台手机的浏览器里。</div>

    <input class="field" id="kO" type="password" autocomplete="off" placeholder="sk-proj-…">
    <button class="main-btn" id="saveKeys">保存并开始</button>
  </section>

  <section id="app" class="hide">
    <section class="loc" aria-live="polite">
      <div class="state" id="locState">还没有定位</div>
      <div class="coords" id="coords">点下面的按钮开始</div>
    </section>

    <button class="main-btn" id="go">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
      讲讲我附近
    </button>
    <div class="row">
      <button class="ghost" id="autoBtn" aria-pressed="false">自动讲解：关</button>
      <button class="ghost" id="voiceBtn" aria-pressed="true">朗读：开</button>
    </div>
    <div class="row hide" id="stopRow"><button class="ghost" id="stopBtn">停止</button></div>
    <div class="status" id="status" role="status"></div>

    <div class="ask">
      <input class="field" id="question" type="text" placeholder="问导游：这栋楼谁设计的？" enterkeyhint="send">
      <button class="ghost" id="askBtn">问</button>
    </div>

    <article class="story" id="story" aria-live="polite"></article>

    <details>
      <summary>补充说明、兴趣和设置</summary>
      <label class="lbl" for="note">补充说明（写一句你看到的东西，定位会准很多）</label>
      <input class="field" id="note" type="text" placeholder="例如：正对着一栋有科林斯柱的老银行楼">
      <div class="chips" id="chips">
        <label class="chip"><input type="checkbox" value="建筑和设计师" checked><span>建筑</span></label>
        <label class="chip"><input type="checkbox" value="历史" checked><span>历史</span></label>
        <label class="chip"><input type="checkbox" value="美食"><span>美食</span></label>
        <label class="chip"><input type="checkbox" value="影视取景"><span>影视取景</span></label>
        <label class="chip"><input type="checkbox" value="拍照机位"><span>拍照机位</span></label>
      </div>
      <label class="lbl" for="voice">语音音色（OpenAI）</label>
      <select class="field" id="voice">
        <option value="nova">nova</option><option value="coral">coral</option><option value="alloy">alloy</option>
        <option value="shimmer">shimmer</option><option value="echo">echo</option><option value="onyx">onyx</option>
      </select>
      <div class="row"><button class="ghost" id="resetKeys">重新填写 API key</button></div>
      <p class="hint">自动讲解：每走出约 300 米且距上次至少 4 分钟会自动讲下一段，连续 12 段后暂停。页面要保持在前台，锁屏后定位会停。</p>
    </details>

    <p class="foot">讲解由 AI 根据位置推断，具体数字和年份请以权威资料为准。</p>
  </section>
</div>

<script>
/* ===== 在这里填 key（填了就不用在页面里输入）===== */
const EMBED_ANTHROPIC_KEY = "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";
const EMBED_OPENAI_KEY = "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";
const MODEL = "claude-sonnet-5-5";
/* ================================================ */
const $ = id => document.getElementById(id);
const AUTO_DIST = 300, AUTO_GAP = 4 * 60 * 1000, AUTO_MAX = 12;
const store = {
  get: k => { try { return localStorage.getItem(k) || ""; } catch (_) { return ""; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} },
  del: k => { try { localStorage.removeItem(k); } catch (_) {} },
};

let pos = null, watchId = null, ctl = null, busy = false;
let lastTold = null, lastToldAt = 0, autoOn = false, autoCount = 0, wakeLock = null;
let voiceOn = true;
const covered = [];
const player = new Audio(); player.preload = "auto"; player.setAttribute("playsinline", "");

/* ---------- 初始化 ---------- */
function showApp(){ $("setup").classList.add("hide"); $("app").classList.remove("hide"); }
function showSetup(){ $("app").classList.add("hide"); $("setup").classList.remove("hide"); }
for (const id of ["voice"]) {
  const v = store.get("wg_" + id); if (v) $(id).value = v;
  $(id).onchange = () => store.set("wg_" + id, $(id).value);
}
if (EMBED_ANTHROPIC_KEY && !store.get("wg_kA")) store.set("wg_kA", EMBED_ANTHROPIC_KEY);
if (EMBED_OPENAI_KEY && !store.get("wg_kO")) store.set("wg_kO", EMBED_OPENAI_KEY);
if (store.get("wg_kA")) showApp(); else showSetup();
$("saveKeys").onclick = () => {
  const a = $("kA").value.trim(), o = $("kO").value.trim();
  if (!a) { $("kA").focus(); return; }
  store.set("wg_kA", a); if (o) store.set("wg_kO", o); else store.del("wg_kO");
  $("kA").value = ""; $("kO").value = "";
  showApp();
};
$("resetKeys").onclick = () => { store.del("wg_kA"); store.del("wg_kO"); stopAuto(); showSetup(); };

/* ---------- 定位 ---------- */
function fmt(p){ const c = p.coords; return `${c.latitude.toFixed(5)}, ${c.longitude.toFixed(5)}　误差约 ${Math.round(c.accuracy)} 米`; }
function dist(a, b){
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b.latitude - a.latitude), dLon = r(b.longitude - a.longitude);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.latitude))*Math.cos(r(b.latitude))*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function locate(){
  return new Promise((res, rej) => {
    if (!("geolocation" in navigator)) return rej({ code: 0 });
    navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 });
  });
}
function geoErr(e){
  if (e && e.code === 1) return "定位被拒绝了。去 设置 → 隐私与安全性 → 定位服务 → Safari 网站，改成「使用期间」，然后刷新页面。";
  if (e && e.code === 3) return "定位超时了，换个开阔点的地方再试。";
  if (!window.isSecureContext) return "这个页面要用 https 地址打开才能定位。";
  return "拿不到定位。可以在「补充说明」里写你在哪。";
}
function status(msg){ $("status").textContent = msg; $("status").classList.toggle("show", !!msg); }

/* ---------- 提示词 ---------- */
function interests(){ return [...document.querySelectorAll("#chips input:checked")].map(i => i.value); }
function context(){
  const L = [];
  if (pos) {
    const c = pos.coords;
    L.push(`游客当前坐标：纬度 ${c.latitude.toFixed(5)}，经度 ${c.longitude.toFixed(5)}（GPS 误差约 ${Math.round(c.accuracy)} 米）。`);
    if (c.heading != null && !isNaN(c.heading) && c.speed > 0.5) L.push(`他正朝方位角 ${Math.round(c.heading)}° 的方向走。`);
  } else L.push("没有 GPS 坐标，只能根据游客的描述判断位置。");
  const note = $("note").value.trim(); if (note) L.push(`游客补充：${note}`);
  L.push(`当地时间：${new Date().toLocaleString("zh-CN", { weekday: "long", hour: "2-digit", minute: "2-digit" })}。`);
  const ins = interests(); if (ins.length) L.push(`游客感兴趣的方向：${ins.join("、")}。`);
  if (covered.length) L.push(`之前已经讲过：${covered.slice(-15).join("、")}。不要重复讲这些，但如果新地方和它们有关联（同一位建筑师、同一段历史），要点出来，比如"你刚才看过的某某也是他设计的"。`);
  return L.join("\n");
}
const STYLE = [
  "讲解风格（严格遵守）：",
  "- 像一个懂行的朋友在耳边讲，信息密度高，有具体的人名、年份、数字、来龙去脉，不要空泛的形容词。",
  "- 人名、建筑名第一次出现时，中文名后面用括号附英文原名，例如：丹尼尔·伯纳姆（Daniel Burnham）。",
  "- 讲建筑时优先讲：原来叫什么、哪年建成、谁设计的、这位设计师还做过什么、后来经历了什么变迁（易主、空置、改造、花了多少钱、哪年以什么身份重新开业）、什么风格、外立面上游客能亲眼看到的细节。",
  "- 只写你有把握的事实。不确定的数字宁可不写，也不要编。",
].join("\n");
const FORMAT_TOUR = [
  "输出格式：",
  "第一行以「📍」开头，一句话说他大概在哪。对坐标没把握就直说，请他补充看到了什么。",
  "然后挑 1–2 个他身边最值得讲的地方（优先他眼前能看到的、最有故事的那栋楼）。每个地方先写一行「## 名称（方向，大约距离）」，下面写 3–4 条要点，每条以「- 」开头，每条 1–3 句话，像这个例子：",
  "## 芝加哥 JW 万豪酒店（你左手边，约 50 米）",
  "- 这栋楼原本是大陆商业国民银行大楼（Continental & Commercial National Bank），1914 年建成，由丹尼尔·伯纳姆（Daniel Burnham）的事务所设计。伯纳姆就是做了 1909 年「芝加哥规划」的那位，名言是「不要做小计划」（Make no little plans）。",
  "- 后来银行变迁、楼空置多年，开发商花了约 3.96 亿美元修复，2010 年以芝加哥第一家 JW 万豪开业，酒店占前 12 层，上面是公寓。",
  "- 新古典主义风格，抬头看外立面的科林斯柱和希腊回纹装饰。",
  "最后一行以「➜ 下一步：」开头，给一个具体建议（往哪走、看什么）。",
  "不要用加粗，总长度 600 字以内。",
].join("\n");
function tourPrompt(){ return `你是一位资深的中文城市导游。根据下面的信息，给游客讲讲他身边的东西。\n\n${context()}\n\n${STYLE}\n\n${FORMAT_TOUR}`; }
function askPrompt(q){
  return `你是一位资深的中文城市导游，正在陪游客边走边看。\n\n${context()}\n\n游客问：${q}\n\n${STYLE}\n\n回答格式：直接回答问题，用 2–5 条以「- 」开头的要点，必要时可以用一行「## 名称」做小标题。不要用加粗，400 字以内。`;
}

/* ---------- 渲染 ---------- */
function esc(s){ return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
function render(text, question){
  let html = question ? `<p class="q">你问：${esc(question)}</p>` : "", inList = false;
  for (const raw of text.split("\n")) {
    const line = raw.trim().replace(/\*\*/g, "");
    if (!line) continue;
    const isLi = /^[-•*]\s+/.test(line);
    if (inList && !isLi) { html += "</ul>"; inList = false; }
    if (line.startsWith("📍")) html += `<p class="where">${esc(line)}</p>`;
    else if (line.startsWith("## ")) html += `<h2>${esc(line.slice(3))}</h2>`;
    else if (line.startsWith("➜")) html += `<p class="next">${esc(line)}</p>`;
    else if (isLi) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${esc(line.replace(/^[-•*]\s+/, ""))}</li>`; }
    else html += `<p>${esc(line)}</p>`;
  }
  if (inList) html += "</ul>";
  $("story").innerHTML = html;
}

/* ---------- 语音：按段合成，按顺序播放 ---------- */
let speechQueue = [], playing = false, speechGen = 0;
function speakable(t){
  return t.split("\n").map(l => l.trim()).filter(Boolean)
    .map(l => l.replace(/^##\s*/, "").replace(/^[-•*]\s+/, "").replace(/[📍➜#*]/g, "")
               .replace(/（[A-Za-z][^）]*）/g, "")       // 去掉括号里的英文原名，听起来更顺
               .replace(/（(你|在|约|正|左|右|前|后|身后|对面)[^）]*）/g, ""))
    .join("。").replace(/。+/g, "。");
}
function resetSpeech(){
  speechGen++; speechQueue = []; playing = false;
  try { player.pause(); } catch (_) {}
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}
function enqueueSpeech(chunk){
  if (!voiceOn) return;
  const text = speakable(chunk); if (!text.replace(/[。\s]/g, "")) return;
  const gen = speechGen;
  const item = { text, audio: fetchTTS(text).catch(() => null) };   // 立即开始合成，播放时按顺序取
  speechQueue.push(item);
  if (!playing) playNext(gen);
}
async function fetchTTS(text){
  const key = store.get("wg_kO"); if (!key) return null;
  const res = await fetch("https://api.openai.com/v1/audio/speech", {
    method: "POST",
    headers: { "Authorization": `Bearer ${key}`, "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "gpt-4o-mini-tts", voice: $("voice").value, input: text, response_format: "mp3",
      instructions: "用中文普通话讲解，语气像热情、见多识广的城市导游，口语化，语速稍快，自然停顿。",
    }),
  });
  if (!res.ok) throw new Error("tts " + res.status);
  return URL.createObjectURL(await res.blob());
}
async function playNext(gen){
  if (gen !== speechGen) return;
  const item = speechQueue.shift();
  if (!item) { playing = false; return; }
  playing = true;
  const url = await item.audio;
  if (gen !== speechGen) return;
  if (url) {
    player.src = url;
    player.onended = () => { URL.revokeObjectURL(url); playNext(gen); };
    try { await player.play(); return; } catch (_) { /* 被系统拦截就退回系统朗读 */ }
  }
  systemSpeak(item.text, () => playNext(gen));
}
function systemSpeak(text, done){
  if (!("speechSynthesis" in window)) return done();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN"; u.rate = 1.05; u.onend = done; u.onerror = done;
  speechSynthesis.speak(u);
}
function silentWav(){ // 生成一小段静音，用来在用户点击时"解锁"自动播放
  const n = 800, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
  const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); v.setUint32(4, 36 + n, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
  w(36, "data"); v.setUint32(40, n, true); for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
  return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
}
function unlockAudio(){
  player.src = silentWav(); player.play().catch(() => {});
  if ("speechSynthesis" in window) { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); }
}

/* ---------- 调用 Claude（流式） ---------- */
async function streamClaude(prompt, onText, signal){
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST", signal,
    headers: {
      "x-api-key": store.get("wg_kA"),
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
      "content-type": "application/json",
    },
    body: JSON.stringify({ model: MODEL, max_tokens: 1500, stream: true, messages: [{ role: "user", content: prompt }] }),
  });
  if (!res.ok) {
    let msg = ""; try { msg = (await res.json()).error?.message || ""; } catch (_) {}
    throw { status: res.status, msg };
  }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", text = "";
  for (;;) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const evt = buf.slice(0, i); buf = buf.slice(i + 2);
      const line = evt.split("\n").find(l => l.startsWith("data: ")); if (!line) continue;
      let d; try { d = JSON.parse(line.slice(6)); } catch (_) { continue; }
      if (d.type === "content_block_delta" && d.delta?.type === "text_delta") { text += d.delta.text; onText(text); }
      if (d.type === "error") throw { status: 500, msg: d.error?.message || "" };
    }
  }
  return text;
}
function errText(e){
  if (e?.name === "AbortError") return "";
  if (e?.status === 401) return "Anthropic API key 无效。点「补充说明、兴趣和设置」→「重新填写 API key」。";
  if (e?.status === 404) return "模型不可用。";
  if (e?.status === 429) return "请求太频繁或额度不足，自动讲解已暂停，稍后再试。";
  if (e?.status === 529 || e?.status === 503) return "服务暂时繁忙，等一会儿再试。";
  if (e instanceof TypeError) return "网络连不上，检查一下信号再试。";
  return "讲解没能完成" + (e?.msg ? `：${e.msg}` : "，稍后再试。");
}

/* ---------- 一次讲解 / 问答 ---------- */
async function run({ auto = false, question = "" } = {}){
  if (busy) return;
  busy = true; resetSpeech();
  $("go").disabled = true; $("askBtn").disabled = true;
  $("titleRow").classList.add("pulse");

  if (!auto) {
    $("locState").textContent = "正在定位…";
    try { pos = await locate(); $("locState").textContent = "已定位"; $("coords").textContent = fmt(pos); }
    catch (e) {
      if (!pos) { $("locState").textContent = "没有定位"; $("coords").textContent = geoErr(e); }
      if (!pos && !$("note").value.trim() && !question) {
        document.querySelector("details").open = true; $("note").focus();
        return done();
      }
    }
  }
  if (auto) { autoCount++; if (navigator.vibrate) navigator.vibrate(120); }

  $("story").innerHTML = `${question ? `<p class="q">你问：${esc(question)}</p>` : ""}<p class="thinking">${auto ? "到新地方了，" : ""}正在想…</p>`;
  $("stopRow").classList.remove("hide");
  ctl = new AbortController();

  // 已送去合成的位置：每写完一整行要点就先送去合成；标题行和下一条要点一起读
  let spokenUpTo = 0;
  const flush = (text, final) => {
    const lines = text.slice(spokenUpTo).split("\n");
    const complete = final ? lines : lines.slice(0, -1);   // 最后一行可能还没写完
    let ready = "", pending = "", consumed = 0, committed = 0;
    for (const l of complete) {
      consumed += l.length + 1;
      if (/^\s*##\s/.test(l)) { pending += l + "\n"; continue; }
      if (!l.trim()) continue;
      ready += pending + l + "\n"; pending = ""; committed = consumed;
    }
    if (final && pending) ready += pending;
    spokenUpTo += committed;
    if (ready.trim()) enqueueSpeech(ready);
  };

  try {
    const prompt = question ? askPrompt(question) : tourPrompt();
    const text = await streamClaude(prompt, t => { render(t, question); flush(t, false); }, ctl.signal);
    render(text, question); flush(text, true);
    for (const m of text.matchAll(/^##\s*([^（(\n]+)/gm)) covered.push(m[1].trim());
    if (!question) { if (pos) lastTold = pos.coords; lastToldAt = Date.now(); }
  } catch (e) {
    const msg = errText(e);
    if (msg) $("story").insertAdjacentHTML("beforeend", `<p class="err">${esc(msg)}</p>`);
    if ([401, 404, 429].includes(e?.status)) stopAuto();
  }
  done();

  function done(){
    busy = false;
    $("go").disabled = false; $("askBtn").disabled = false;
    $("stopRow").classList.add("hide");
    $("titleRow").classList.remove("pulse");
    if (autoOn && autoCount >= AUTO_MAX) { stopAuto(); status(`已经连续自动讲了 ${AUTO_MAX} 段，先暂停。想继续就再打开自动讲解。`); }
  }
}

/* ---------- 自动讲解 ---------- */
function onMove(p){
  pos = p;
  $("locState").textContent = "自动讲解中";
  $("coords").textContent = fmt(p);
  if (!autoOn || busy) return;
  if (!lastTold) { status(""); run({ auto: true }); return; }
  const d = dist(lastTold, p.coords), wait = AUTO_GAP - (Date.now() - lastToldAt);
  if (d >= AUTO_DIST && wait <= 0 && document.visibilityState === "visible") { status(""); run({ auto: true }); return; }
  if (d < AUTO_DIST) status(`再走约 ${Math.round(AUTO_DIST - d)} 米，自动讲下一段。`);
  else status(`已经走出 ${Math.round(d)} 米，约 ${Math.ceil(wait / 60000)} 分钟后自动讲下一段。`);
}
async function keepAwake(){ try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (_) { wakeLock = null; } }
document.addEventListener("visibilitychange", () => { if (autoOn && document.visibilityState === "visible") keepAwake(); });

function startAuto(){
  if (!("geolocation" in navigator) || !window.isSecureContext) { status(geoErr({})); return; }
  autoOn = true; autoCount = 0;
  unlockAudio(); keepAwake();
  watchId = navigator.geolocation.watchPosition(onMove, e => {
    status(geoErr(e)); if (e.code === 1) stopAuto();
  }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
  $("autoBtn").setAttribute("aria-pressed", "true"); $("autoBtn").textContent = "自动讲解：开";
  status("正在获取位置，拿到后马上开讲。");
}
function stopAuto(){
  autoOn = false;
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  $("autoBtn").setAttribute("aria-pressed", "false"); $("autoBtn").textContent = "自动讲解：关";
  if ($("locState").textContent === "自动讲解中") $("locState").textContent = "已定位";
  status("");
}

/* ---------- 按钮 ---------- */
$("go").onclick = () => { unlockAudio(); run(); };
$("autoBtn").onclick = () => autoOn ? stopAuto() : startAuto();
$("stopBtn").onclick = () => { ctl?.abort(); resetSpeech(); };
$("voiceBtn").onclick = () => {
  voiceOn = !voiceOn;
  $("voiceBtn").setAttribute("aria-pressed", voiceOn);
  $("voiceBtn").textContent = voiceOn ? "朗读：开" : "朗读：关";
  if (voiceOn) unlockAudio(); else resetSpeech();
};
const ask = () => { const q = $("question").value.trim(); if (!q) return; $("question").value = ""; unlockAudio(); run({ question: q }); };
$("askBtn").onclick = ask;
$("question").addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
</script>
